name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_stellabill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_stellabill?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit + contract tests
        run: go test ./...
      - name: OpenAPI validation
        run: go run ./cmd/openapi-validate
      - name: Coverage (>= 70% baseline for non-cmd packages)
        shell: bash
        run: |
          set -euo pipefail
          pkgs=$(go list ./... | grep -v '^stellarbill-backend/cmd/')
          coverpkgs=$(echo "$pkgs" | paste -sd, -)
          go test -count=1 -coverpkg="$coverpkgs" -coverprofile=coverage.out $pkgs
          total=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          python3 - <<PY
          total=float("$total")
          print(f"Total coverage (non-cmd): {total:.1f}%")
          # Baseline ratchet: raise this floor as test coverage improves.
          raise SystemExit(0 if total >= 70.0 else 1)
          PY
