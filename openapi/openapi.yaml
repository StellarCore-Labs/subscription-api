openapi: 3.0.3
info:
  title: Stellabill Backend API
  description: |
    Stellabill backend HTTP API.

    This specification covers all implemented `/api/*` routes.

    Notes:
      - Preflight CORS requests (`OPTIONS`) are handled by middleware and return `204`.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Plans
  - name: Subscriptions
  - name: Statements
  - name: Admin
  - name: Features
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check (v1)
      operationId: getHealthV1
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/plans:
    get:
      tags: [Plans]
      summary: List billing plans
      operationId: listPlans
      responses:
        "200":
          description: Plans list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
        "401":
          description: Missing or invalid credentials
  /api/v1/plans:
    get:
      tags: [Plans]
      summary: List billing plans (v1)
      operationId: listPlansV1
      responses:
        "200":
          description: Plans list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
        "401":
          description: Missing or invalid credentials
  /api/subscriptions:
    get:
      tags: [Subscriptions]
      summary: List subscriptions
      operationId: listSubscriptions
      responses:
        "200":
          description: Subscriptions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionsResponse"
        "401":
          description: Missing or invalid credentials
        "403":
          description: Insufficient permissions
  /api/v1/subscriptions:
    get:
      tags: [Subscriptions]
      summary: List subscriptions (v1)
      operationId: listSubscriptionsV1
      responses:
        "200":
          description: Subscriptions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionsResponse"
        "401":
          description: Missing or invalid credentials
        "403":
          description: Insufficient permissions
  /api/subscriptions/{id}:
    get:
      tags: [Subscriptions]
      summary: Get one subscription
      operationId: getSubscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          description: Missing or invalid credentials
        "403":
          description: Insufficient permissions
        "404":
          description: Subscription not found
  /api/v1/subscriptions/{id}:
    get:
      tags: [Subscriptions]
      summary: Get one subscription (v1)
      operationId: getSubscriptionV1
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          description: Missing or invalid credentials
        "403":
          description: Insufficient permissions
        "404":
          description: Subscription not found
  /api/statements:
    get:
      tags: [Statements]
      summary: List billing statements for the caller
      operationId: listStatements
      responses:
        "200":
          description: Statements list
        "401":
          description: Missing or invalid credentials
  /api/statements/{id}:
    get:
      tags: [Statements]
      summary: Get one billing statement
      operationId: getStatement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Statement identifier
      responses:
        "200":
          description: Statement detail
        "401":
          description: Missing or invalid credentials
        "404":
          description: Statement not found
  /api/admin/purge:
    post:
      tags: [Admin]
      summary: Purge the cache
      operationId: adminPurgeCache
      responses:
        "200":
          description: Purge result
        "401":
          description: Missing or invalid credentials
        "403":
          description: Insufficient permissions
  /api/admin/diagnostics:
    get:
      tags: [Admin]
      summary: Re-run startup diagnostics
      operationId: adminDiagnostics
      responses:
        "200":
          description: Diagnostics report
        "401":
          description: Missing or invalid credentials
        "403":
          description: Insufficient permissions
  /api/admin/reconcile:
    post:
      tags: [Admin]
      summary: Reconcile subscriptions against the contract snapshot
      operationId: adminReconcile
      responses:
        "200":
          description: Reconciliation report
        "401":
          description: Missing or invalid credentials
        "403":
          description: Insufficient permissions
  /api/admin/reports:
    get:
      tags: [Admin]
      summary: List persisted reconciliation reports
      operationId: adminListReports
      responses:
        "200":
          description: Reconciliation reports
        "401":
          description: Missing or invalid credentials
        "403":
          description: Insufficient permissions
  /api/billing/new-flow:
    get:
      tags: [Features]
      summary: New billing flow (feature flagged)
      operationId: getNewBillingFlow
      responses:
        "200":
          description: Feature is enabled
        "503":
          description: Feature is unavailable
  /api/analytics/advanced:
    get:
      tags: [Features]
      summary: Advanced analytics (feature flagged)
      operationId: getAdvancedAnalytics
      responses:
        "200":
          description: Feature is enabled
        "503":
          description: Feature is unavailable
components:
  parameters:
    SubscriptionID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Subscription identifier
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: stellarbill-backend
    Plan:
      type: object
      additionalProperties: false
      required: [id, name, amount, currency, interval]
      properties:
        id:
          type: string
          example: plan_basic
        name:
          type: string
          example: Basic
        amount:
          type: string
          description: Amount as string (placeholder until DB integration).
          example: "1000"
        currency:
          type: string
          example: NGN
        interval:
          type: string
          example: monthly
        description:
          type: string
          example: Starter plan
    PlansResponse:
      type: object
      additionalProperties: false
      required: [plans]
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
    Subscription:
      type: object
      additionalProperties: false
      required: [id, plan_id, customer, status, amount, interval]
      properties:
        id:
          type: string
          example: sub_123
        plan_id:
          type: string
          example: plan_basic
        customer:
          type: string
          example: customer_123
        status:
          type: string
          example: active
        amount:
          type: string
          example: "1000"
        interval:
          type: string
          example: monthly
        next_billing:
          type: string
          description: Next billing datetime (string placeholder).
          example: "2026-04-01T00:00:00Z"
    SubscriptionsResponse:
      type: object
      additionalProperties: false
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
